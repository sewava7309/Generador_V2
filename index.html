<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Usuarios</title>

<style>
:root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #334155;
    --result-bg: #0f172a;
}

body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: var(--card-bg);
    padding: 35px;
    border-radius: 20px;
    width: 100%;
    max-width: 450px;
    text-align: center;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border-color);
}

h2 {
    margin-top: 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.025em;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
}

button:hover {
    background: var(--accent-hover);
}

button:active {
    transform: scale(0.98);
}

#resultado {
    margin-top: 20px;
    text-align: left;
    background: var(--result-bg);
    padding: 15px;
    border-radius: 12px;
    height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border-color);
}

/* Scrollbar personalizada */
#resultado::-webkit-scrollbar {
    width: 6px;
}
#resultado::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 3px;
}

.usuario {
    padding: 8px 4px;
    border-bottom: 1px solid var(--border-color);
    font-size: 0.95rem;
    color: var(--text-muted);
    transition: color 0.2s ease;
}

.usuario:last-child {
    border-bottom: none;
}

.usuario:hover {
    color: var(--text-main);
}
</style>

</head>
<body>

<div class="container">
    <h2>Generador de Usuarios</h2>
    <button onclick="generar()">Generar 20 usuarios</button>
    <div id="resultado"></div>
</div>

<script>
const hombres = [
"Felipe","Luis","Carlos","Diego","Jorge","Miguel","Kevin","Mateo",
"Sebastian","Daniel","Alejandro","Cristian","Jhon","Brayan","Jean",
"Adrian","Eduardo","Fernando","Gabriel","Hugo","Ivan","Jose",
"Leonardo","Manuel","Nicolas","Oscar","Pablo","Raul","Ricardo",
"Samuel","Tomas","Victor","Yordi","Alonso","Andres","Arturo",
"Bruno","Cesar","David","Erick","Franco","Gustavo","Henry",
"Ismael","Julio","Kevin","Luciano","Martin","Renzo","William"
];

const mujeres = [
"Kiara","Sofia","Camila","Valeria","Lucia","Andrea","Nicole",
"Renata","Paola","Emilia","Daniela","Alejandra","Fernanda",
"Mariana","Diana","Carla","Claudia","Vanessa","Yuliana",
"Melissa","Milagros","Rosa","Karen","Jazmin","Bianca",
"Brenda","Cynthia","Dayana","Eliana","Fiorella","Gabriela",
"Ingrid","Jenifer","Katherine","Leslie","Liliana","Lorena",
"Lucero","Maribel","Natalia","Noelia","Patricia","Rocio",
"Ruth","Sandra","Silvana","Tatiana","Veronica","Yessenia","Zulema"
];

const apellidos = [
"Huaman","Lopez","Lopes","Garcia","Perez","Torres","Flores",
"Vargas","Rojas","Mendoza","Castillo","Sanchez","Quispe",
"Ramirez","Gutierrez","Silva","Fernandez","Paredes","Cruz",
"Salazar","Lara","Diaz","Morales","Vega","Navarro","Campos",
"Cordero","Chavez","Espinoza","Benites","Aguilar","Valdez",
"Cerna","Alarcon","Carranza","Cordova","Delgado","Fuentes",
"Gamarra","Herrera","Leiva","Marquez","Mejia","Ortega",
"Palacios","Peña","Reyes","Rios","Suarez","Zambrano"
];

function random(lista){
    return lista[Math.floor(Math.random()*lista.length)];
}

function crearUsuario(listaNombres){
    return random(listaNombres) +
           random(apellidos) +
           random(apellidos) +
           Math.floor(Math.random()*100);
}

function generar(){
    const usados = new Set();
    const salida = document.getElementById("resultado");
    salida.innerHTML = "";

    while([...usados].filter(x=>x.startsWith("H-")).length < 50){
        usados.add("H-" + crearUsuario(hombres));
    }

    while([...usados].filter(x=>x.startsWith("M-")).length < 50){
        usados.add("M-" + crearUsuario(mujeres));
    }

    // Nota: Aunque el botón dice "Generar 20", tu lógica genera y filtra el conjunto. 
    // Tomamos una muestra aleatoria de 20 para mostrar en pantalla acorde al texto del botón:
    const seleccionados = [...usados].sort(() => 0.5 - Math.random()).slice(0, 20).sort();

    seleccionados.forEach(u=>{
        salida.innerHTML += `<div class="usuario">${u.substring(2)}</div>`;
    });
}
</script>

</body>
</html>
